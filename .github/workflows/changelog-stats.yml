# Redraws the "Project growth" charts at the top of CHANGELOG.md and copies the
# version number from js/config.js into index.html, every time the page or the
# CHANGELOG changes. Free; takes a few seconds.
name: Changelog stats

on:
  push:
    branches: [main]
    paths:
      - "CHANGELOG.md"
      - "index.html"
      - "css/**"
      - "js/**"
      - "scripts/**"
      - ".github/workflows/changelog-stats.yml"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: changelog-stats
  cancel-in-progress: false

jobs:
  update-charts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy the version number into index.html
        run: python3 scripts/stamp_version.py
      - name: Count and redraw the charts
        run: python3 scripts/changelog_stats.py
      - name: Save the changes, if any
        run: |
          if git diff --quiet; then
            echo "Already up to date."
            exit 0
          fi
          git config user.name "changelog-stats bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md stats/code-lines.json index.html
          git commit -m "Update version stamp and project growth charts"
          git pull --rebase
          git push
